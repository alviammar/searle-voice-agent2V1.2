<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sania Learning Monitor</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f8fd;color:#0f2340;margin:0;padding:28px}main{max-width:960px;margin:auto;background:white;border-radius:24px;padding:26px;box-shadow:0 20px 60px rgba(41,76,126,.12)}h1{margin-top:0}.muted{color:#71819b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.card{border:1px solid #dfe9f5;border-radius:16px;padding:14px}.event{border-top:1px solid #e8eef7;padding:12px 0}.tag{display:inline-block;background:#edf4fc;border-radius:999px;padding:4px 8px;font-size:12px}code{white-space:pre-wrap}</style></head><body><main><h1>Sania Learning Monitor</h1><p class="muted">This dashboard learns caller wording only. Approved Extor medical facts are never changed automatically.</p><div id="counts" class="grid"></div><h2>Recent calls / unmatched phrases</h2><div id="events">Loading…</div></main><script src="config.js"></script><script>const B=String(window.SEARLE_BACKEND_URL||"").replace(/\/$/,"");fetch((B||"")+"/api/learning-summary").then(r=>r.json()).then(d=>{const c=document.getElementById("counts");c.innerHTML=Object.entries(d.learnedPhraseCounts||{}).map(([k,v])=>`<div class="card"><b>${k}</b><br><span class="muted">${v} learned phrases</span></div>`).join("")||'<div class="card">No learned phrases yet.</div>';document.getElementById("events").innerHTML=(d.recent||[]).map(e=>`<div class="event"><span class="tag">${e.intent||"unknown"}</span> <span class="tag">${e.usedClaude?"Claude fallback":"Fast path"}</span><br><b>${(e.text||"").replace(/</g,"&lt;")}</b><br><span class="muted">${e.ts||""}${e.latencyMs?" · "+e.latencyMs+" ms":""}</span></div>`).join("")||"No calls logged yet."}).catch(e=>document.getElementById("events").textContent=e.message);</script></body></html>
